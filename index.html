<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>性格診断PWA</title>
<style>
body{font-family:sans-serif;max-width:500px;margin:auto;padding:16px;background:#f5f5f5}
h2,h3{text-align:center}
.hidden{display:none}
.choice-box{display:flex;flex-direction:column;gap:16px}
.choice-item{
  background:white;padding:12px;border:2px solid #ccc;border-radius:8px;
  cursor:pointer;transition:.2s;border:none;text-align:left;width:100%
}
.choice-item:hover{border-color:#333}
.choice-item.selected{border:2px solid #0077ff;background:#e8f4ff}
.choice-item img{
  width:100%;height:180px;object-fit:cover;border-radius:6px;margin-bottom:8px;
  background:#ddd;display:block
}
.input-box{display:flex;flex-direction:column;gap:10px}
input{padding:12px;font-size:16px}
.btn-group{display:flex;gap:10px;margin-top:10px}
button{flex:1;padding:14px;font-size:16px;border:none;color:white;background:#333;border-radius:6px}
.reset-btn{background:#aa0000}
.back-btn{background:#555}
.result{display:none;margin-top:20px;padding:12px;background:white;border:1px solid #ccc;border-radius:8px}
.result table{width:100%;border-collapse:collapse}
.result td{border:1px solid #999;padding:8px}
.label{background:#eee;width:40%}
.value{text-align:right}
</style>
</head>
<body>

<h2>性格診断</h2>

<div id="choiceScreen">
  <h3>気に入った画像を1つ選んでください</h3>
  <div class="choice-box">
    <button type="button" class="choice-item" onclick="selectChoice('A', this)">
      <img id="imgA" src="https://blog-imgs-171.fc2.com/k/a/o/kaorusaku/202604240846560d2.png" alt="画像A"
           onerror="this.src='https://blog-imgs-171.fc2.com/k/a/o/kaorusaku/202604240846560d2.png'">
      <p>A: あなたは 織田信長 タイプです</p>
    </button>
    <button type="button" class="choice-item" onclick="selectChoice('B', this)">
      <img id="imgB" src="https://blog-imgs-201.fc2.com/k/a/o/kaorusaku/20260513121747cc7.jpeg" alt="画像B"
           onerror="this.src='https://blog-imgs-201.fc2.com/k/a/o/kaorusaku/20260513121747cc7.jpeg'">
      <p>B: あなたは 豊臣秀吉 タイプです</p>
    </button>
    <button type="button" class="choice-item" onclick="selectChoice('C', this)">
      <img id="imgC" src="https://blog-imgs-201.fc2.com/k/a/o/kaorusaku/202605131219148d9.png" alt="画像C"
           onerror="this.src='https://blog-imgs-201.fc2.com/k/a/o/kaorusaku/202605131219148d9.png'">
      <p>C: あなたは 徳川家康 タイプです</p>
    </button>
  </div>
  <button id="toCalcBtn" class="hidden" style="margin-top:16px;width:100%;background:#0077ff" onclick="goToCalc()">診断を始める</button>
</div>

<div id="calcScreen" class="hidden">
  <p id="selectedType" style="text-align:center;font-weight:bold"></p>

  <div class="input-box">
    <input id="B" type="number" placeholder="B">
    <input id="S" type="number" placeholder="S">
    <input id="T1" type="number" placeholder="T1">
    <input id="T2" type="number" placeholder="T2">
  </div>

  <div class="btn-group">
    <button onclick="calc()">計算</button>
    <button onclick="showResult()">表示</button>
    <button class="reset-btn" onclick="resetAll()">リセット</button>
  </div>

  <button class="back-btn" style="width:100%;margin-top:10px" onclick="goBack()">戻る</button>

  <div id="resultBox" class="result">
    <table>
      <tr><td class="label">S</td><td class="value" id="viewS">-</td></tr>
      <tr><td class="label">B</td><td class="value" id="viewB">-</td></tr>
      <tr><td class="label">O1</td><td class="value" id="O1">-</td></tr>
      <tr><td class="label">O2</td><td class="value" id="O2">-</td></tr>
      <tr><td class="label"><strong>O3 = B-S-O1</strong></td><td class="value"><strong id="O3">-</strong></td></tr>
      <tr><td class="label"><strong>O4 = B-S-O2</strong></td><td class="value"><strong id="O4">-</strong></td></tr>
      <tr><td class="label"><strong>result = O1+O2-O3-O4</strong></td><td class="value"><strong id="result">-</strong></td></tr>
    </table>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycby3p9KLSlESfF-2BmPv7B4n995E2Gu4pNjhpitk-Y3Zfen6jvIAdbe63NTmajSxBbgz/exec";
const GAS_URL_RESULT = "https://script.google.com/macros/s/AKfycbzEkZEy7KoM1rOzlNAugfP2yrf-53V7UmBemHajna0LJ2VcdKxq4-BFtwGJlC7B9UzC/exec";

let calcData = null;
let selectedChoice = null;

function selectChoice(choice, el){
  selectedChoice = choice;
  document.querySelectorAll('.choice-item').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('toCalcBtn').classList.remove('hidden');
}

function goToCalc(){
  if(!selectedChoice) return;
  document.getElementById('choiceScreen').classList.add('hidden');
  document.getElementById('calcScreen').classList.remove('hidden');
  document.getElementById('selectedType').textContent = {
    'A':'A: あなたは 織田信長 タイプです',
    'B':'B: あなたは 豊臣秀吉 タイプです',
    'C':'C: あなたは 徳川家康 タイプです'
  }[selectedChoice];
}

function goBack(){
  document.getElementById('calcScreen').classList.add('hidden');
  document.getElementById('choiceScreen').classList.remove('hidden');
}

async function calc(){
  const B = Number(document.getElementById("B").value);
  const S = Number(document.getElementById("S").value);
  const T1 = Number(document.getElementById("T1").value);
  const T2 = Number(document.getElementById("T2").value);

  if([B,S,T1,T2].some(v=>isNaN(v))){
    alert("全て入力してください");
    return;
  }

  try{
    const res = await fetch(GAS_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({B,S,T1,T2})
    });
    const data = await res.json();

    const O1 = Number(data.O1);
    const O2 = Number(data.O2);

    if(isNaN(O1)||isNaN(O2)){
      alert("GASからO1,O2が返ってきていません");
      return;
    }

    const O3 = B - S - O1;
    const O4 = B - S - O2;
    const result = O1 + O2 - O3 - O4;

    calcData = {B,S,O1,O2,O3,O4,result};

    // ここでresultだけをGASに送る。他の計算で上書きしない
    sendResultToGAS(result);
    alert("計算完了\nresult="+result);
  }catch(e){
    alert("GAS通信エラー: "+e);
  }
}

async function sendResultToGAS(result){
  try{
    await fetch(GAS_URL_RESULT,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({result:result, choice:selectedChoice})
    });
  }catch(e){
    console.log("送信失敗:",e);
  }
}

function showResult(){
  if(!calcData){
    alert("先に計算してください");
    return;
  }
  document.getElementById("resultBox").style.display="block";

  document.getElementById("viewS").textContent=calcData.S;
  document.getElementById("viewB").textContent=calcData.B;
  document.getElementById("O1").textContent=calcData.O1;
  document.getElementById("O2").textContent=calcData.O2;
  document.getElementById("O3").textContent=calcData.O3;
  document.getElementById("O4").textContent=calcData.O4;
  document.getElementById("result").textContent=calcData.result;
}

function resetAll(){
  document.getElementById("B").value="";
  document.getElementById("S").value="";
  document.getElementById("T1").value="";
  document.getElementById("T2").value="";
  document.getElementById("resultBox").style.display="none";
  calcData=null;
}
</script>
</body>
</html>
